# SPDX-License-Identifier: MIT
name: Setup
description: Install Node from mise.toml and pnpm, restore the pnpm cache and install the dependencies.

# A local action is read from the checked-out tree, so actions/checkout
# must run before it. mise-action comes first and puts the Node of
# mise.toml on the PATH. pnpm/action-setup comes before setup-node, whose
# `cache: pnpm` needs pnpm on the PATH.
#
# setup-node is kept only for the pnpm store cache, without a version:
# v4.4.0 cannot read mise.toml (getNodeVersionFromFile in src/util.ts
# parses JSON or a bare `node <version>` line only), and src/main.ts
# treats the version as optional while still restoring the cache.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        # Dependabot does not bump this input: bump it by hand with the
        # action (also in .github/workflows/demo.yml).
        version: 2026.11.14
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

# SPDX-License-Identifier: MIT
# Dependabot version updates.
# Keys and values checked against
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  # The npm ecosystem also covers pnpm and its lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    # Wait before proposing a fresh release; majors wait longer.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Minor and patch updates are batched per dependency type. Majors
    # match no group, so each one gets its own pull request.
    groups:
      production-minor-patch:
        dependency-type: production
        patterns: ['*']
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies]
    # The scope is part of the prefix; `include: scope` would append a
    # second one. Dependabot adds the colon after a closing parenthesis.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    # `/` alone covers .github/workflows and a root action.yml only; the
    # composite actions need their own entry. `directories` accepts globs,
    # `directory` does not, and the two keys cannot be combined.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    # Only `default-days` applies to GitHub Actions.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
    commit-message:
      prefix: ci

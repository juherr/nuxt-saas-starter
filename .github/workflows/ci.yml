# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

# Pull requests share one group per branch so a new push cancels the
# previous run; pushes to main get one group per commit so no commit's
# run is replaced by a newer pending one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm lint --max-warnings=0
      # mise comes from the setup action; the version is pinned here.
      - name: shellcheck
        run: mise x aqua:koalaman/shellcheck@0.11.0 -- shellcheck -x .github/scripts/*.sh

  # Every file needs licensing information: an SPDX header, or an entry
  # in REUSE.toml for files that cannot hold a comment.
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow's: keep contents: read and
    # add the OIDC token the Codecov upload signs in with.
    permissions:
      contents: read
      id-token: write
    # The rate limiter's Redis test runs against the Redis service, the
    # database upgrade query tests against the PostgreSQL one (each test file
    # creates its own database through TEST_DATABASE_URL); with CI set and
    # no REDIS_URL or TEST_DATABASE_URL they fail instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unit
          POSTGRES_PASSWORD: unit-password
          POSTGRES_DB: unit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unit -d unit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Anchored here and reused by smoke-node.
      redis: &redis-service
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://unit:unit-password@localhost:5432/unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # Same projects as `pnpm test:ci`, run once with coverage on.
      - run: pnpm test:ci:coverage
      - name: Check the coverage report exists
        run: |
          if [ ! -s tests/coverage/lcov.info ]; then
            echo "::error::tests/coverage/lcov.info is missing or empty: no coverage to upload"
            exit 1
          fi
      # OIDC needs id-token: write; on a fork PR GitHub gives no token and
      # the action falls back to a tokenless upload, so no secret is exposed.
      # An upload failure (app not installed, Codecov down) does not fail CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: tests/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  # Builds with no database, Redis, Stripe, Resend or other secret, then
  # deploys that build the way docs/SELF_HOSTING_NODE.md describes:
  # `nuxt db migrate` from the checkout, and the database given to the
  # server at start. Checks the health endpoint and an email sign-in.
  smoke-build-without-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Anchored here and reused by smoke-node. No Redis: without REDIS_URL
      # at build the sessions use the fs-lite KV driver.
      postgres: &postgres-service
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values only. No variable the build reads is set at job
    # level (DATABASE_URL, POSTGRES_URL, REDIS_URL, NUXT_APP_URL): steps
    # take these under their own names.
    env:
      SMOKE_DATABASE_URL: postgres://smoke:smoke-password@localhost:5432/smoke
      SMOKE_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # Built before the migrations exist, as from a fresh clone.
      - name: Build without a database
        run: pnpm build
        env:
          NUXT_NITRO_PRESET: node-server
      - name: Generate migrations
        run: pnpm db:generate
      # Runs `nuxt prepare` in the checkout and applies the generated
      # server/db/migrations, so it needs the sources, not .output.
      - name: Apply the migrations with nuxt db migrate
        run: pnpm exec nuxt db migrate
        env:
          DATABASE_URL: ${{ env.SMOKE_DATABASE_URL }}
      # The build baked an empty databaseUrl and baseURL into .output, so
      # the server reads them from their runtime overrides: DATABASE_URL
      # alone leaves /api/health at 503 (docs/SELF_HOSTING_NODE.md).
      - name: Start the server
        run: node .output/server/index.mjs > server.log 2>&1 &
        env:
          NUXT_DATABASE_URL: ${{ env.SMOKE_DATABASE_URL }}
          NUXT_PUBLIC_BASE_URL: ${{ env.SMOKE_APP_URL }}
          NUXT_BETTER_AUTH_SECRET: ci-smoke-throwaway-secret-0123456789abcdef
          PORT: 3000
      - name: Wait for /api/health
        run: .github/scripts/smoke-wait-health.sh
        env:
          NUXT_APP_URL: ${{ env.SMOKE_APP_URL }}
      - name: Seed a user
        run: node create-admin.ts
        env:
          DATABASE_URL: ${{ env.SMOKE_DATABASE_URL }}
          NUXT_ADMIN_EMAIL: smoke-admin@example.com
          NUXT_ADMIN_PASSWORD: smoke-admin-password
      - name: Sign in with email and password
        run: .github/scripts/smoke-sign-in.sh sign-in smoke-admin@example.com smoke-admin-password
        env:
          NUXT_APP_URL: ${{ env.SMOKE_APP_URL }}
      # The cookie jar is left out: it holds a session only after a
      # successful sign-in, and the headers already show the cookie.
      - name: Upload the server log and smoke responses
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-build-without-db-server-log
          path: |
            server.log
            sign-in-headers.txt
            sign-in-body.txt

  # Builds and starts the Node server against throwaway PostgreSQL and Redis
  # services, then checks the health endpoint, an email sign-in and an
  # authenticated SSR page under /<org-slug>/ (organization switch,
  # typed URL, foreign Host).
  smoke-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: *postgres-service
      redis: *redis-service
    # Throwaway values only, no repository secret. NuxtHub reads
    # DATABASE_URL and REDIS_URL at build time: the first one makes the
    # build apply the migrations, the second one selects the Redis KV
    # driver.
    env:
      NUXT_NITRO_PRESET: node-server
      DATABASE_URL: postgres://smoke:smoke-password@localhost:5432/smoke
      REDIS_URL: redis://localhost:6379
      NUXT_APP_URL: http://localhost:3000
      NUXT_BETTER_AUTH_SECRET: ci-smoke-throwaway-secret-0123456789abcdef
      NUXT_ADMIN_EMAIL: smoke-admin@example.com
      NUXT_ADMIN_PASSWORD: smoke-admin-password
      PORT: 3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Generate migrations
        run: pnpm db:generate
      - name: Build (applies the migrations through NuxtHub)
        run: pnpm build
      # The foreign key that deletes an organization's API keys exists only
      # once NuxtHub applies server/db/queries after the migrations: nothing
      # else fails if that registration is lost.
      - name: Check the API key organization foreign key (build)
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          const client = new pg.Client(process.env.DATABASE_URL)
          await client.connect()
          const { rows } = await client.query(
            "SELECT confdeltype FROM pg_constraint WHERE conname = 'api_key_reference_id_organization_id_fk'"
          )
          await client.end()
          if (rows[0]?.confdeltype !== 'c') {
            console.error('::error::api_key_reference_id_organization_id_fk is missing or not ON DELETE CASCADE')
            process.exit(1)
          }
          EOF
      - name: Start the server
        run: node .output/server/index.mjs > server.log 2>&1 &
      - name: Wait for /api/health
        run: .github/scripts/smoke-wait-health.sh
      - name: Reset the database to the demo seed
        env:
          DEMO_RESET_CONFIRM: localhost
        run: pnpm demo:reset
      - name: Check the API key organization foreign key (nuxt db migrate)
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          const client = new pg.Client(process.env.DATABASE_URL)
          await client.connect()
          const { rows } = await client.query(
            "SELECT confdeltype FROM pg_constraint WHERE conname = 'api_key_reference_id_organization_id_fk'"
          )
          await client.end()
          if (rows[0]?.confdeltype !== 'c') {
            console.error('::error::api_key_reference_id_organization_id_fk is missing or not ON DELETE CASCADE')
            process.exit(1)
          }
          EOF
      - name: Seed a user
        run: node create-admin.ts
      - name: Sign in with email and password
        run: .github/scripts/smoke-sign-in.sh sign-in "$NUXT_ADMIN_EMAIL" "$NUXT_ADMIN_PASSWORD"
      # Uses the admin session, so it runs before the reset below. The
      # name is the one create-admin.ts gives the user.
      - name: Render an organization page server-side
        run: .github/scripts/smoke-ssr-page.sh sign-in 'Admin User'
      # A second reset proves it is idempotent over a seeded database. It
      # wipes smoke-admin too, hence after the admin sign-in.
      - name: Reset the database to the demo seed again
        env:
          DEMO_RESET_CONFIRM: localhost
        run: pnpm demo:reset
      - name: Sign in with the demo account
        run: .github/scripts/smoke-sign-in.sh demo-sign-in demo@example.com demo-password
      # demo@example.com is a member of Acme Demo only. The id is the fixed
      # GLOBEX_LABS_ORGANIZATION_ID of scripts/demo/seedData.ts.
      - name: Check that a non-member cannot open another organization
        run: >-
          .github/scripts/smoke-cross-org.sh demo-sign-in globex-labs
          01934b00-0000-7000-8000-000000000102 'Globex Labs'
      - name: Upload the server log and smoke responses
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-node-server-log
          path: |
            server.log
            sign-in-headers.txt
            sign-in-body.txt
            ssr-org-*.json
            ssr-*-headers.txt
            ssr-*-body.txt
            foreign-host.log
            demo-sign-in-headers.txt
            demo-sign-in-body.txt
            cross-org-*.txt

  # Runs the Playwright e2e suite (vitest project `e2e`) in a browser
  # against the built Node server, with throwaway PostgreSQL and Redis
  # services. test:ci in the unit job leaves this project out.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres: *postgres-service
      redis: *redis-service
    # Throwaway values only, no repository secret. The pages render
    # global.appName from app/i18n/global.json; the build reads
    # NUXT_APP_NAME only for a meta tag. The e2e tests read NUXT_APP_NAME
    # to find that title, so it must equal global.appName.
    env:
      NUXT_NITRO_PRESET: node-server
      DATABASE_URL: postgres://smoke:smoke-password@localhost:5432/smoke
      REDIS_URL: redis://localhost:6379
      NUXT_APP_URL: http://localhost:3000
      NUXT_PUBLIC_BASE_URL: http://localhost:3000
      NUXT_APP_NAME: House of BetterAuth
      NUXT_BETTER_AUTH_SECRET: ci-smoke-throwaway-secret-0123456789abcdef
      PORT: 3000
      NUXT_TEST_APP_URL: http://localhost:3000
      # The admin, seeded by create-admin.ts.
      NUXT_ADMIN_EMAIL: e2e-admin@example.com
      NUXT_ADMIN_PASSWORD: e2e-admin-password
      # A regular user with a verified email (auth.test.ts expects /403).
      NUXT_TEST_EMAIL: e2e-user@example.com
      NUXT_TEST_PASSWORD: e2e-user-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Generate migrations
        run: pnpm db:generate
      - name: Build (applies the migrations through NuxtHub)
        run: pnpm build
      - name: Start the server
        run: node .output/server/index.mjs > server.log 2>&1 &
      - name: Wait for /api/health
        run: .github/scripts/smoke-wait-health.sh
      - name: Seed the admin
        run: node create-admin.ts
      - name: Seed the regular user
        run: .github/scripts/e2e-seed-user.sh
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_USER: smoke
          POSTGRES_DB: smoke
      # Headless chromium.launch() runs chromium-headless-shell in
      # playwright-core 1.65.1 (getExecutableName), so the full browser is
      # not downloaded. The version is the one in the lockfile.
      - name: Install the Playwright browser
        run: pnpm exec playwright-core install --with-deps --only-shell chromium
      # Bounded below the job timeout: a hang fails this step instead of
      # cancelling the job, so the failure() upload below still runs.
      - name: Run the e2e suite
        timeout-minutes: 15
        run: >-
          pnpm exec vitest run --project e2e
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/e2e/junit.xml
      # tests/e2e/setup.ts writes a screenshot of each page a failed test
      # opened into test-results/e2e/.
      - name: Upload the server log, screenshots and test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            server.log
            sign-up-body.txt
            test-results/e2e/

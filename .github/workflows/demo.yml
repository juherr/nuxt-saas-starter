# SPDX-License-Identifier: MIT
name: Demo

# Public demo on Cloudflare Workers (free plan), see docs/DEMO_DEPLOYMENT.md.
# - After a green CI run on a push to main: reset the database, then deploy.
# - Every night: reset the database only.
# - On demand (workflow_dispatch): reset, then deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Off the top of the hour: GitHub delays scheduled runs under load, the
    # start of every hour included, and may drop them; 03:00 never fired.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: '23 2 * * *'
  workflow_dispatch: {}

# One run at a time, and no running one is cancelled: a reset or a deploy
# stopped halfway would leave the demo broken. GitHub still keeps a single
# pending run per group: a newer run replaces the pending one. A run that
# fails the gate (CI not green, not a push, or a fork's main) skips all its
# jobs, so it gets a group of its own and cannot displace a pending run.
# The gate here and the reset job's if: must stay the same text.
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'demo' || format('demo-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    # workflow_run fires for every completed CI run whose head branch is
    # named main, including a pull request from a fork's own main branch.
    # Without the event and repository checks, that fork's code would run
    # here with the demo secrets. On schedule and workflow_dispatch,
    # github.event.workflow_run is null and only the first test applies.
    # Keep this text identical to the gate of the concurrency group above.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # Read from the tree checked out above, at the CI run's head SHA.
      # Its pnpm install runs postinstall, hence nuxt prepare.
      - uses: ./.github/actions/setup
      - name: Generate migrations
        run: pnpm db:generate
      # DEMO_DATABASE_URL is the direct (non-pooler) Neon URL of the owner
      # role. The reset refuses to run unless DEMO_RESET_CONFIRM is the
      # exact hostname of DATABASE_URL.
      - name: Reset the database to the demo seed
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          DEMO_RESET_CONFIRM=$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).hostname)')
          echo "::add-mask::$DEMO_RESET_CONFIRM"
          export DEMO_RESET_CONFIRM
          pnpm demo:reset

  deploy:
    needs: reset
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_KV_ID: ${{ vars.DEMO_KV_ID }}
      DEMO_HYPERDRIVE_ID: ${{ vars.DEMO_HYPERDRIVE_ID }}
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Before the build: the cloudflare-module preset merges the root
      # wrangler.jsonc into .output/server/wrangler.json, which is the file
      # wrangler deploy then uses. Rendered after the build, the worker
      # would be deployed without its KV, Hyperdrive and vars. The explicit
      # variable list keeps "$schema" intact.
      - name: Render wrangler.jsonc
        run: |
          # shellcheck disable=SC2016 # envsubst expands the list itself
          envsubst '${DEMO_KV_ID} ${DEMO_HYPERDRIVE_ID} ${DEMO_BASE_URL}' \
            < deploy/demo/wrangler.template.jsonc > wrangler.jsonc
      # No DATABASE_URL or REDIS_URL in this job: the first one would make
      # the build apply migrations and freeze the URL into .output, the
      # second one selects the ioredis KV driver, which does not run on
      # Workers.
      - name: Build
        run: pnpm build
        env:
          NUXT_NITRO_PRESET: cloudflare-module
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Proves the routes answer and NUXT_PUBLIC_DEMO_MODE reached the
      # worker, not that requests fit the free plan's CPU budget. Chained
      # requests can exceed it: the worker then answers 503 with the body
      # "error code: 1102". Each request is therefore tried up to three
      # times on that answer only; any other unexpected answer fails at
      # once.
      - name: Smoke test
        run: |
          attempts=3
          delay=${SMOKE_RETRY_DELAY:-5}

          # request <label> <expected status> <body file> <curl args...>
          request() {
            local label=$1 expected=$2 body=$3 status attempt
            shift 3
            for attempt in $(seq 1 "$attempts"); do
              status=$(curl -sS -o "$body" -w '%{http_code}' "$@") || status=000
              echo "$label: attempt $attempt answered $status"
              if [ "$status" = "$expected" ]; then
                return 0
              fi
              # 000: no answer yet, e.g. right after the deploy
              if [ "$status" != 000 ] && [ "$status" != 503 ] && ! grep -qs 'error code: 1102' "$body"; then
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            echo "::error::$label answered $status instead of $expected"
            cat "$body" 2>/dev/null || true
            echo
            return 1
          }

          # The new version can take a few seconds to answer everywhere:
          # give the first request up to a minute
          attempts=12
          request health 200 demo-health-body.txt "$DEMO_BASE_URL/api/health"
          rm -f demo-health-body.txt
          attempts=3

          # better-auth checks Origin against the base URL, so it must equal
          # DEMO_BASE_URL. Over HTTPS the cookie carries the __Secure- prefix.
          request 'demo sign-in' 200 demo-sign-in-body.txt \
            -D demo-sign-in-headers.txt -c demo-cookies.txt \
            -X POST "$DEMO_BASE_URL/api/auth/sign-in/email" \
            -H 'Content-Type: application/json' \
            -H "Origin: $DEMO_BASE_URL" \
            -d '{"email":"demo@example.com","password":"demo-password"}'
          # A 200 carries a live session: never print its headers.
          if ! grep -Eqi '^set-cookie: (__Secure-)?better-auth\.session_token=' demo-sign-in-headers.txt; then
            echo "::error::no better-auth session cookie in the demo sign-in response"
            exit 1
          fi
          rm -f demo-sign-in-headers.txt demo-sign-in-body.txt

          # With the demo session, a password change must be refused with
          # 403 DEMO_MODE_RESTRICTED. The current password sent is wrong on
          # purpose: without the flag the request still changes nothing.
          if ! request 'demo change-password' 403 demo-change-password-body.txt \
            -b demo-cookies.txt \
            -X POST "$DEMO_BASE_URL/api/auth/change-password" \
            -H 'Content-Type: application/json' \
            -H "Origin: $DEMO_BASE_URL" \
            -d '{"currentPassword":"not-the-demo-password","newPassword":"demo-smoke-new-password"}' \
            || ! grep -q 'DEMO_MODE_RESTRICTED' demo-change-password-body.txt; then
            rm -f demo-cookies.txt
            echo "::error::change-password was not refused with DEMO_MODE_RESTRICTED: demo mode is off"
            cat demo-change-password-body.txt
            echo
            exit 1
          fi
          rm -f demo-cookies.txt demo-change-password-body.txt

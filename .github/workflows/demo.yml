# SPDX-License-Identifier: MIT
name: Demo

# Public demo on Cloudflare Workers (free plan), see docs/DEMO_DEPLOYMENT.md.
# - After a green CI run on a push to main: reset the database, then deploy.
# - Every night: reset the database only.
# - On demand (workflow_dispatch): reset, then deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Off the top of the hour: GitHub delays scheduled runs under load, the
    # start of every hour included, and may drop them; 03:00 never fired.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: '23 2 * * *'
  workflow_dispatch: {}

# One run at a time, and no running one is cancelled: a reset or a deploy
# stopped halfway would leave the demo broken. GitHub still keeps a single
# pending run per group: a newer run replaces the pending one. A run that
# fails the gate (CI not green, not a push, a fork's main, or not the tip
# of main) skips all its jobs, so it gets a group of its own,
# demo-skipped-<run id>, and cannot displace a pending run.
#
# On workflow_run, github.sha is the last commit on the default branch when
# this run is created ("Last commit on default branch",
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run),
# and the workflow definition is read from there, while the jobs check out
# the CI run's head_sha. When several pushes land in a row, the CI run of
# an older commit completes after main has moved on: its Demo run would mix
# the steps of the tip with the scripts of the older commit. Requiring
# head_sha == github.sha skips that run; the CI run of the tip triggers its
# own. Workflow definition and checked-out scripts then come from the same
# commit.
# The gate here and the reset job's if: must stay the same text
# (tests/unit/demoWorkflowGate.test.ts).
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha)) && 'demo' || format('demo-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    # workflow_run fires for every completed CI run whose head branch is
    # named main, including a pull request from a fork's own main branch.
    # Without the event and repository checks, that fork's code would run
    # here with the demo secrets. The head_sha test skips a CI run that is
    # no longer the tip of main (see the concurrency comment above). On
    # schedule and workflow_dispatch, github.event.workflow_run is null and
    # only the first test applies.
    # Keep this text identical to the gate of the concurrency group above.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # Read from the tree checked out above, at the CI run's head SHA.
      # Its pnpm install runs postinstall, hence nuxt prepare.
      - uses: ./.github/actions/setup
      - name: Generate migrations
        run: pnpm db:generate
      # DEMO_DATABASE_URL is the direct (non-pooler) Neon URL of the owner
      # role. The reset refuses to run unless DEMO_RESET_CONFIRM is the
      # exact hostname of DATABASE_URL.
      - name: Reset the database to the demo seed
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          DEMO_RESET_CONFIRM=$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).hostname)')
          echo "::add-mask::$DEMO_RESET_CONFIRM"
          export DEMO_RESET_CONFIRM
          pnpm demo:reset

  deploy:
    needs: reset
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_KV_ID: ${{ vars.DEMO_KV_ID }}
      DEMO_HYPERDRIVE_ID: ${{ vars.DEMO_HYPERDRIVE_ID }}
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Before the build: the cloudflare-module preset merges the root
      # wrangler.jsonc into .output/server/wrangler.json, which is the file
      # wrangler deploy then uses. Rendered after the build, the worker
      # would be deployed without its KV, Hyperdrive and vars. The explicit
      # variable list keeps "$schema" intact.
      - name: Render wrangler.jsonc
        run: |
          # shellcheck disable=SC2016 # envsubst expands the list itself
          envsubst '${DEMO_KV_ID} ${DEMO_HYPERDRIVE_ID} ${DEMO_BASE_URL}' \
            < deploy/demo/wrangler.template.jsonc > wrangler.jsonc
      # No DATABASE_URL or REDIS_URL in this job: the first one would make
      # the build apply migrations and freeze the URL into .output, the
      # second one selects the ioredis KV driver, which does not run on
      # Workers.
      - name: Build
        run: pnpm build
        env:
          NUXT_NITRO_PRESET: cloudflare-module
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Proves the routes answer and NUXT_PUBLIC_DEMO_MODE reached the
      # worker, not that requests fit the free plan's CPU budget. Chained
      # requests can exceed it: the worker then answers 503 with the body
      # "error code: 1102". The sign-in and the change-password requests
      # are therefore tried up to three times on that answer only (or on
      # no answer); any other unexpected answer fails at once. The health
      # wait retries for up to a minute. Same scripts as the CI smoke jobs.
      - name: Smoke test
        env:
          NUXT_APP_URL: ${{ vars.DEMO_BASE_URL }}
          SMOKE_RETRY_ATTEMPTS: '3'
        run: |
          # The cookie jar holds a live demo session: drop it however the
          # step ends.
          trap 'rm -f demo-sign-in-*.txt' EXIT
          # The new version can take a few seconds to answer everywhere.
          .github/scripts/smoke-wait-health.sh
          .github/scripts/smoke-sign-in.sh demo-sign-in demo@example.com demo-password
          .github/scripts/smoke-demo-restricted.sh demo-sign-in

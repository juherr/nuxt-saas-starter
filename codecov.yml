# SPDX-License-Identifier: MIT
# Codecov settings (https://docs.codecov.com/docs/codecov-yaml).
# Both statuses are informational: they report project and patch coverage
# on pull requests without failing them. Thresholds come later, once the
# baseline is reviewed.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: 'header, diff, files'
  behavior: default
  require_changes: false
